<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Agenda - Login</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f5;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }
    .auth-container {
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .auth-container h1 {
      color: #1a3a4a;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
    }
    .auth-container .form-group {
      margin-bottom: 16px;
    }
    .auth-container label {
      display: block;
      font-weight: 500;
      margin-bottom: 4px;
      color: #333;
    }
    .auth-container input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .auth-container input:focus {
      border-color: #1a3a4a;
      outline: none;
    }
    .auth-container button {
      width: 100%;
      padding: 12px;
      background: #1a3a4a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .auth-container button:hover {
      background: #0f2938;
    }
    .auth-container .switch-link {
      text-align: center;
      margin-top: 16px;
      color: #666;
    }
    .auth-container .switch-link a {
      color: #1a3a4a;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }
    .auth-container .switch-link a:hover {
      text-decoration: underline;
    }
    .message {
      color: #d32f2f;
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }
    .success-message {
      color: #2e7d32;
    }
  </style>
</head>
<body>
  <div class="auth-container" id="authContainer">
    <h1 id="formTitle">Iniciar Sesión</h1>
    <form id="authForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" id="submitBtn">Ingresar</button>
      <div id="message" class="message"></div>
      <div class="switch-link">
        <span id="switchText">¿No tienes cuenta?</span>
        <a id="switchAction">Regístrate</a>
      </div>
    </form>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
