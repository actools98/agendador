<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Agenda</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/calendar.css">
  <style>
    /* Layout general */
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f8f9fa;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background: white;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      padding: 20px 0;
      flex-shrink: 0;
      height: 100vh;
      box-sizing: border-box;
    }
    .sidebar-header {
      padding: 0 20px 20px;
      font-size: 20px;
      font-weight: 700;
      color: #1a3a4a;
      border-bottom: 1px solid #eee;
      margin-bottom: 16px;
    }
    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
    }
    .menu-item {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      color: #333;
      cursor: pointer;
      transition: background 0.15s, border-left 0.15s;
      border-left: 4px solid transparent;
      font-weight: 500;
      gap: 12px;
    }
    .menu-item:hover {
      background: #f0f4f8;
    }
    .menu-item.active {
      background: #e8edf2;
      border-left-color: #1a3a4a;
      color: #1a3a4a;
    }
    .menu-item .icon { font-size: 20px; width: 24px; text-align: center; }
    .menu-item .label { flex: 1; }
    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid #eee;
    }
    .logout-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #d32f2f;
      cursor: pointer;
      font-weight: 500;
      padding: 8px 0;
      transition: color 0.15s;
    }
    .logout-btn:hover { color: #b71c1c; }
    .main-content {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
      background: #f8f9fa;
    }
    .view-container {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      min-height: 80vh;
    }
    .view-title {
      font-size: 24px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 20px;
    }
    /* Vista placeholder */
    .placeholder {
      color: #999;
      text-align: center;
      padding: 60px 0;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">📅 Mi Agenda</div>
    <div class="sidebar-menu">
      <div class="menu-item active" data-view="calendar">
        <span class="icon">📅</span>
        <span class="label">Calendario</span>
      </div>
      <div class="menu-item" data-view="availability">
        <span class="icon">⏳</span>
        <span class="label">Disponibilidad</span>
      </div>
      <div class="menu-item" data-view="settings">
        <span class="icon">⚙️</span>
        <span class="label">Configuración</span>
      </div>
    </div>
    <div class="sidebar-footer">
      <div class="logout-btn" id="logoutBtn">
        <span>🔒</span> Cerrar sesión
      </div>
    </div>
  </div>
  <div class="main-content">
    <div class="view-container" id="viewContainer">
      <!-- El contenido se carga dinámicamente -->
      <div id="viewContent"></div>
    </div>
  </div>
  <script src="/js/dashboard.js"></script>
</body>
</html>
